/* ---------- Utilidades ---------- */
const eur=(n)=>(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
function lineUnitPrice(item,quality){
  if(!item) return 0;
  if(item.hasQuality && quality){
    const q=QUALITY_LEVELS.find(x=>x.key===quality);
    if(q) return Math.round(item.price*q.factor*100)/100;
  }
  return item.price;
}
function computeQuote(quote,catalog){
  let base=0;
  const detail=quote.lines.map(l=>{const item=catalog.find(c=>c.id===l.itemId);
    const unit=lineUnitPrice(item,l.quality);
    const lineBase=unit*l.qty; base+=lineBase; return {...l,item,unit,lineBase};});
  const discountAmt=base*(quote.discount/100); const baseAfter=base-discountAmt;
  let ivaTotal=0; detail.forEach(d=>{ivaTotal+=(d.lineBase-d.lineBase*(quote.discount/100))*((d.item?.iva||0)/100);});
  return {detail,base,discountAmt,baseAfter,ivaTotal,total:baseAfter+ivaTotal};
}

/* ============================================================
   LLAMADA A OPENAI — generación de imagen
   ============================================================ */
async function generateAIImage(apiKey, prompt, quality){
  const body = { model:"gpt-image-2", prompt, n:1, size:"1024x1024" };
  // gpt-image-2 admite calidad: "low" | "medium" | "high"
  if(quality) body.quality = quality;
  const res = await fetch("https://api.openai.com/v1/images/generations",{
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+apiKey },
    body: JSON.stringify(body),
  });
  if(!res.ok){
    let msg = "Error "+res.status;
    try{ const j=await res.json(); msg = j.error?.message || msg; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const b64 = data.data?.[0]?.b64_json;
  if(b64) return "data:image/png;base64,"+b64;
  if(data.data?.[0]?.url) return data.data[0].url;
  throw new Error("Respuesta inesperada de la API");
}

function Header({title,onBack,right}){return <div style={{display:"flex",alignItems:"center",gap:10,padding:"18px 4px 6px"}}>

  <h1 style={{fontFamily:"Fraunces,serif",fontSize:22,fontWeight:600,color:C.ink,margin:0,flex:1,letterSpacing:"-.02em"}}>{title}</h1>{right}</div>;}
function InfoLine({label,value,last}){return <div style={{padding:"11px 0",borderBottom:last?"none":`1px solid ${C.line}`}}>
  <div style={{fontSize:11.5,color:C.muted,marginBottom:2}}>{label}</div><div style={{fontSize:14,color:C.ink}}>{value}</div></div>;}
function Chip({active,onClick,children}){return <button onClick={onClick} style={{padding:"8px 14px",borderRadius:22,fontSize:13,fontWeight:600,cursor:"pointer",border:`1px solid ${active?C.ink:C.line}`,background:active?C.ink:C.card,color:active?C.paper:C.ink}}>{children}</button>;}
function Field({label,...props}){return <label style={{display:"block",marginBottom:12}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>{label}</div><input {...props} style={inp}/></label>;}
function Tline({k,v}){return <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",fontSize:13.5,color:C.muted}}><span>{k}</span><span style={{color:C.ink,fontWeight:500}}>{v}</span></div>;}

/* ---------- PIN gate ---------- */
function PinGate({pin,onOk}){
  const [val,setVal]=useState("");
  const [err,setErr]=useState(false);
  const press=(d)=>{ const n=(val+d).slice(0,6); setVal(n); setErr(false);
    if(n.length===pin.length){ if(n===pin){onOk();}else{setErr(true);setTimeout(()=>setVal(""),400);} } };
  return <div style={{minHeight:"100vh",background:C.black,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{fontFamily:"Times,serif",fontSize:44,fontWeight:700,color:"#fff"}}>MMR</div>
    <div style={{fontFamily:"Times,serif",fontStyle:"italic",fontSize:15,color:"#aaa",marginBottom:30}}>servicios</div>
    <div style={{display:"flex",gap:12,marginBottom:30}}>
      {Array.from({length:pin.length}).map((_,i)=><div key={i} style={{width:14,height:14,borderRadius:"50%",background:i<val.length?(err?C.clay:"#fff"):"#444"}}/>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:14}}>
      {[1,2,3,4,5,6,7,8,9,"",0,"←"].map((k,i)=> k===""?<div key={i}/>:
        <button key={i} onClick={()=>k==="←"?setVal(val.slice(0,-1)):press(k)} style={{width:72,height:72,borderRadius:"50%",border:"1px solid #333",background:"#1a1a1a",color:"#fff",fontSize:24,cursor:"pointer"}}>{k}</button>)}
    </div>
  </div>;
}

function NewQuoteScreen({data,go,addQuote,pre}){
  const [clientId,setClientId]=useState(pre?.clientId||data.clients[0]?.id||"");
  const [projectId,setProjectId]=useState(pre?.projectId||"");
  const [discount,setDiscount]=useState(0); const [lines,setLines]=useState([]);
  const [q,setQ]=useState(""); const [cat,setCat]=useState("Todas");
  const projs=data.projects.filter(p=>p.clientId===clientId);
  const cats=["Todas",...Array.from(new Set(data.catalog.map(c=>c.cat)))];
  const filtered=data.catalog.filter(it=>(cat==="Todas"||it.cat===cat)&&it.name.toLowerCase().includes(q.toLowerCase()));
  const addLine=(it)=>{if(lines.find(l=>l.itemId===it.id))return;setLines([...lines,{itemId:it.id,qty:1,quality:it.hasQuality?"std":undefined}]);};
  const setQty=(id,v)=>setLines(lines.map(l=>l.itemId===id?{...l,qty:Math.max(0,+v||0)}:l));
  const setQ2=(id,v)=>setLines(lines.map(l=>l.itemId===id?{...l,quality:v}:l));
  const rm=(id)=>setLines(lines.filter(l=>l.itemId!==id));
  const t=computeQuote({lines,discount:+discount||0},data.catalog);
  const save=()=>{if(!clientId||lines.length===0){alert("Elige cliente y al menos una partida.");return;}
    addQuote({id:uid("q"),number:String(data.company.nextNumber),clientId,projectId:projectId||projs[0]?.id||"",
      date:new Date().toISOString().slice(0,10),validity:30,status:"borrador",discount:+discount||0,lines});
    go("quotes");};
  return <div><Header title="Nuevo presupuesto" onBack={()=>go("quotes")}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16,marginTop:8}}>
      <label style={{display:"block",marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Cliente</span><span onClick={()=>go("newClient")} style={{...lnk,fontSize:12}}>+ Nuevo</span></div>
        <select value={clientId} onChange={e=>{setClientId(e.target.value);setProjectId("");}} style={inp}>{data.clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></label>
      {projs.length>0&&<label style={{display:"block"}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Obra (opcional)</div>
        <select value={projectId} onChange={e=>setProjectId(e.target.value)} style={inp}><option value="">— Sin obra —</option>{projs.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></label>}
    </div>
    <Section title="Añadir partidas" action={<button onClick={()=>go("catalog")} style={lnk}>Gestionar</button>}/>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar servicio…" style={inp}/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",margin:"10px 0"}}>
      {cats.map(c=><Chip key={c} active={cat===c} onClick={()=>setCat(c)}>{c}</Chip>)}</div>
    <div style={{maxHeight:240,overflowY:"auto",background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"2px 12px"}}>
      {filtered.map(it=>{const sel=!!lines.find(l=>l.itemId===it.id);
        return <div key={it.id} onClick={()=>sel?rm(it.id):addLine(it)} style={{padding:"10px 0",borderBottom:`1px solid ${C.line}`,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
          <div style={{width:24,height:24,borderRadius:7,border:`1.5px solid ${sel?C.clay:C.line}`,background:sel?C.clay:"transparent",display:"grid",placeItems:"center",flexShrink:0}}>{sel&&<I.check size={15} color="#fff"/>}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:13.5,color:C.ink,fontWeight:500}}>{it.name}</div><div style={{fontSize:11.5,color:C.muted}}>{it.cat} · {eur(it.price)}/{it.unit}{it.hasQuality?" · calidad":""}</div></div>
        </div>;})}
      {filtered.length===0&&<div style={{...empty,padding:"16px 0"}}>Sin resultados</div>}
    </div>
    {lines.length>0&&<><Section title={`Partidas elegidas (${lines.length})`}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"4px 14px"}}>
      {lines.map((l,i)=>{const it=data.catalog.find(c=>c.id===l.itemId); const unit=lineUnitPrice(it,l.quality);
        return <div key={l.itemId} style={{padding:"11px 0",borderBottom:i===lines.length-1?"none":`1px solid ${C.line}`}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1,minWidth:0}}><div style={{fontSize:13.5,color:C.ink,fontWeight:500}}>{it.name}</div><div style={{fontSize:12,color:C.muted}}>{eur(unit)} / {it.unit}</div></div>
          <input type="number" value={l.qty} onChange={e=>setQty(l.itemId,e.target.value)} inputMode="decimal" style={{width:54,padding:"7px 6px",borderRadius:9,border:`1px solid ${C.line}`,textAlign:"center",fontSize:14}}/>
          <button onClick={()=>rm(l.itemId)} style={{background:"none",border:"none",cursor:"pointer",color:C.clayDk}}><I.x size={18}/></button></div>
        {it.hasQuality&&<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
          {QUALITY_LEVELS.map(qq=><button key={qq.key} onClick={()=>setQ2(l.itemId,qq.key)} style={{padding:"5px 10px",borderRadius:16,fontSize:11.5,fontWeight:600,cursor:"pointer",border:`1px solid ${l.quality===qq.key?C.sage:C.line}`,background:l.quality===qq.key?C.sage:C.card,color:l.quality===qq.key?"#fff":C.muted}}>{qq.label}</button>)}
        </div>}
      </div>;})}</div></>}
    <div style={{marginTop:14,display:"flex",alignItems:"center",gap:12}}><div style={{fontSize:13,color:C.muted,fontWeight:600}}>Descuento %</div>
      <input type="number" value={discount} onChange={e=>setDiscount(e.target.value)} inputMode="decimal" style={{width:70,padding:"8px",borderRadius:9,border:`1px solid ${C.line}`,textAlign:"center"}}/></div>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"6px 14px",marginTop:14}}>
      <Tline k="Base imponible" v={eur(t.base)}/>{discount>0&&<Tline k={`Descuento (${discount}%)`} v={"− "+eur(t.discountAmt)}/>}
      <Tline k="IVA (21%)" v={eur(t.ivaTotal)}/>
      <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 8px",borderTop:`1px solid ${C.line}`,marginTop:4}}>
        <span style={{fontWeight:700,color:C.ink}}>Total</span><span style={{fontWeight:700,color:C.clay,fontSize:20,fontFamily:"Fraunces,serif"}}>{eur(t.total)}</span></div></div>
    <button onClick={save} style={{...big,background:C.clay,color:"#fff",width:"100%",marginTop:16}}>Guardar presupuesto</button>
  </div>;
}

function CatalogScreen({data,go,update}){
  const [edit,setEdit]=useState(null); // item being edited or "new"
  const cats=Array.from(new Set(data.catalog.map(c=>c.cat)));
  const save=(it)=>{
    update(d=>{
      const exists=d.catalog.find(c=>c.id===it.id);
      return {...d, catalog: exists? d.catalog.map(c=>c.id===it.id?it:c) : [...d.catalog, it]};
    });
    setEdit(null);
  };
  const del=(id)=>{ if(confirm("¿Eliminar este servicio del catálogo?")) update(d=>({...d,catalog:d.catalog.filter(c=>c.id!==id)})); };
  if(edit){
    const it=edit==="new"?{id:uid("c"),code:"",name:"",unit:"ud",cat:cats[0]||"Otros",price:0,iva:21,hasQuality:false}:edit;
    return <CatalogEdit item={it} cats={cats} onSave={save} onCancel={()=>setEdit(null)}/>;
  }
  return <div>
    <Header title="Catálogo" onBack={()=>go("quotes")} right={<button onClick={()=>setEdit("new")} style={addBtn}><I.plus size={18} color={C.paper}/></button>}/>
    <div style={{fontSize:12.5,color:C.muted,padding:"4px 4px 8px"}}>Añade, edita o borra servicios. Los precios son orientativos: ajústalos a los tuyos.</div>
    {cats.map(cat=><div key={cat}>
      <Section title={cat}/>
      {data.catalog.filter(c=>c.cat===cat).map(it=>
        <Row key={it.id} onClick={()=>setEdit(it)}>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,color:C.ink,fontSize:13.5}}>{it.name}</div>
            <div style={{fontSize:11.5,color:C.muted}}>{eur(it.price)}/{it.unit}{it.hasQuality?" · con calidad":""}</div></div>
          <button onClick={(e)=>{e.stopPropagation();del(it.id);}} style={{background:"none",border:"none",cursor:"pointer",color:C.clayDk}}><I.trash size={18}/></button>
        </Row>)}
    </div>)}
  </div>;
}

function CatalogEdit({item,cats,onSave,onCancel}){
  const [f,setF]=useState(item);
  const set=(k)=>(e)=>setF({...f,[k]:e.target.value});
  return <div>
    <Header title={item.name?"Editar servicio":"Nuevo servicio"} onBack={onCancel}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16,marginTop:8}}>
      <Field label="Nombre del servicio *" value={f.name} onChange={set("name")} placeholder="Ej. Colocar suelo porcelánico"/>
      <label style={{display:"block",marginBottom:12}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Categoría</div>
        <input list="cats" value={f.cat} onChange={set("cat")} style={inp} placeholder="Pavimentos, Fontanería…"/>
        <datalist id="cats">{cats.map(c=><option key={c} value={c}/>)}</datalist></label>
      <label style={{display:"block",marginBottom:12}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Unidad</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{["ud","m²","ml","m³","h","día"].map(u=><Chip key={u} active={f.unit===u} onClick={()=>setF({...f,unit:u})}>{u}</Chip>)}</div></label>
      <Field label="Precio estándar (€)" type="number" value={f.price} onChange={e=>setF({...f,price:+e.target.value||0})} inputMode="decimal"/>
      <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}}>
        <div><div style={{fontSize:14,color:C.ink}}>Permitir elegir calidad</div><div style={{fontSize:11.5,color:C.muted}}>Económico / Estándar / Primera / Alta gama</div></div>
        <input type="checkbox" checked={!!f.hasQuality} onChange={e=>setF({...f,hasQuality:e.target.checked})} style={{width:20,height:20}}/></label>
    </div>
    <button onClick={()=>{if(!f.name.trim()){alert("Pon un nombre.");return;}onSave(f);}} style={{...big,background:C.clay,color:"#fff",width:"100%",marginTop:16}}>Guardar servicio</button>
  </div>;
}


function QuoteScreen({data,id,go,update}){
  const qt=data.quotes.find(x=>x.id===id);
  const cl=data.clients.find(c=>c.id===qt?.clientId);
  const pr=data.projects.find(p=>p.id===qt?.projectId);
  const [busy,setBusy]=useState(false);
  if(!qt) return null;
  const t=computeQuote(qt,data.catalog);
  const setStatus=(s)=>update(d=>({...d,quotes:d.quotes.map(x=>x.id===id?{...x,status:s}:x)}));
  const makePDF=(action)=>{
    setBusy(true);
    try{
      const doc=generateQuotePDF(qt,cl,pr,data.company,data.catalog);
      const fname=`Presupuesto_${qt.number}_${(cl?.name||"cliente").replace(/\s/g,"_")}.pdf`;
      if(action==="share"&&navigator.canShare){
        const blob=doc.output("blob");
        const file=new File([blob],fname,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){ navigator.share({files:[file],title:"Presupuesto "+qt.number}).catch(()=>{}); setBusy(false); return; }
      }
      doc.save(fname);
    }catch(e){ alert("Error al generar PDF: "+e.message); }
    setBusy(false);
  };
  return <div>
    <Header title={`Presup. ${qt.number}`} onBack={()=>go("quotes")} right={<button onClick={()=>{if(confirm("¿Eliminar?")){update(d=>({...d,quotes:d.quotes.filter(x=>x.id!==id)}));go("quotes");}}} style={{background:"none",border:"none",cursor:"pointer",color:C.clayDk}}><I.trash size={20}/></button>}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:11.5,color:C.muted}}>Cliente</div><div style={{fontWeight:600,color:C.ink,fontSize:15}}>{cl?.name}</div>
        <div style={{fontSize:12.5,color:C.muted,marginTop:2}}>{cl?.nif}</div></div><Badge map={QUOTE_STATUS} value={qt.status}/></div>
      <div style={{display:"flex",gap:20,marginTop:14,fontSize:12.5}}><div><div style={{color:C.muted}}>Fecha</div><div style={{fontWeight:600,color:C.ink}}>{qt.date}</div></div>
        <div><div style={{color:C.muted}}>Validez</div><div style={{fontWeight:600,color:C.ink}}>{qt.validity} días</div></div></div></div>
    <Section title="Partidas"/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"4px 14px"}}>
      {t.detail.map((d,i)=><div key={d.itemId} style={{padding:"11px 0",borderBottom:i===t.detail.length-1?"none":`1px solid ${C.line}`,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:13.5,color:C.ink,fontWeight:500}}>{d.item?.name}{d.item?.hasQuality&&d.quality?<span style={{color:C.sage}}> · {qLabel(d.quality)}</span>:null}</div><div style={{fontSize:12,color:C.muted}}>{d.qty} {d.item?.unit} × {eur(d.unit)}</div></div>
        <div style={{fontWeight:600,color:C.ink,fontSize:13.5}}>{eur(d.lineBase)}</div></div>)}</div>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"6px 14px",marginTop:12}}>
      <Tline k="Base imponible" v={eur(t.base)}/>{qt.discount>0&&<Tline k={`Descuento (${qt.discount}%)`} v={"− "+eur(t.discountAmt)}/>}
      <Tline k="IVA (21%)" v={eur(t.ivaTotal)}/>
      <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 8px",borderTop:`1px solid ${C.line}`,marginTop:4}}>
        <span style={{fontWeight:700,color:C.ink}}>Total</span><span style={{fontWeight:700,color:C.clay,fontSize:20,fontFamily:"Fraunces,serif"}}>{eur(t.total)}</span></div></div>
    <Section title="Estado"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{Object.keys(QUOTE_STATUS).map(s=><Chip key={s} active={qt.status===s} onClick={()=>setStatus(s)}>{QUOTE_STATUS[s].label}</Chip>)}</div>
    <Section title="Texto del documento" action={<button onClick={()=>go("editDoc",id)} style={lnk}>Editar</button>}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"4px 14px"}}>
      <InfoLine label="Descripción del trabajo" value={qt.projDesc||"(sin texto · usa el predeterminado)"}/>
      <InfoLine label="Condiciones de pago" value={qt.conditions||("Transferencia "+(data.company.iban||""))}/>
      <InfoLine label="Observaciones" value={qt.observations||"—"} last/>
    </div>
    {(()=>{ const existing=(data.invoices||[]).find(f=>f.fromQuote===id);
      if(existing) return <div onClick={()=>go("invoice",existing.id)} style={{marginTop:16,background:C.sage+"18",border:`1px solid ${C.sage}`,borderRadius:14,padding:"13px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
        <I.receipt size={20} color={C.sage}/><div style={{flex:1}}><div style={{fontWeight:700,color:C.ink,fontSize:14}}>Factura {existing.number} generada</div><div style={{fontSize:12,color:C.muted}}>Toca para verla</div></div><I.fwd size={18} color={C.muted}/></div>;
      if(qt.status==="aceptado") return <button onClick={()=>{
        const inv={id:uid("inv"),number:String(data.company.nextInvoice||1),clientId:qt.clientId,projectId:qt.projectId,
          fromQuote:id,date:new Date().toISOString().slice(0,10),status:"pendiente",discount:qt.discount,lines:qt.lines};
        update(d=>({...d,invoices:[inv,...(d.invoices||[])],company:{...d.company,nextInvoice:(+d.company.nextInvoice||1)+1}}));
        go("invoice",inv.id);
      }} style={{...big,width:"100%",marginTop:16,background:C.clay,color:"#fff"}}><I.receipt size={17} color="#fff"/> Convertir en factura</button>;
      return <div style={{marginTop:16,fontSize:12.5,color:C.muted,textAlign:"center"}}>Marca el presupuesto como <b>Aceptado</b> para poder facturarlo.</div>;
    })()}
    <div style={{display:"flex",gap:10,marginTop:12}}>
      <button disabled={busy} onClick={()=>makePDF("save")} style={{...big,background:C.ink,color:C.paper,opacity:busy?.6:1}}><I.pdf size={16} color={C.paper}/> {busy?"…":"Descargar PDF"}</button>
      <button disabled={busy} onClick={()=>makePDF("share")} style={{...big,background:C.sage,color:"#fff",opacity:busy?.6:1}}><I.chat size={16} color="#fff"/> Enviar</button>
    </div>
  </div>;
}

}

function InvoiceScreen({data,id,go,update}){
  const inv=(data.invoices||[]).find(x=>x.id===id);
  const cl=data.clients.find(c=>c.id===inv?.clientId);
  const [busy,setBusy]=useState(false);
  if(!inv) return null;
  const t=computeQuote(inv,data.catalog);
  const setStatus=(s)=>update(d=>({...d,invoices:d.invoices.map(x=>x.id===id?{...x,status:s}:x)}));
  const makePDF=(action)=>{
    setBusy(true);
    try{
      const doc=generateInvoicePDF(inv,cl,data.company,data.catalog);
      const fname=`Factura_${inv.number}_${(cl?.name||"cliente").replace(/\s/g,"_")}.pdf`;
      if(action==="share"&&navigator.canShare){
        const blob=doc.output("blob"); const file=new File([blob],fname,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){ navigator.share({files:[file],title:"Factura "+inv.number}).catch(()=>{}); setBusy(false); return; }
      }
      doc.save(fname);
    }catch(e){ alert("Error al generar PDF: "+e.message); }
    setBusy(false);
  };
  return <div>
    <Header title={`Factura ${inv.number}`} onBack={()=>go("invoices")} right={<button onClick={()=>{if(confirm("¿Eliminar factura?")){update(d=>({...d,invoices:d.invoices.filter(x=>x.id!==id)}));go("invoices");}}} style={{background:"none",border:"none",cursor:"pointer",color:C.clayDk}}><I.trash size={20}/></button>}/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:18,padding:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:11.5,color:C.muted}}>Cliente</div><div onClick={()=>go("client",cl?.id)} style={{fontWeight:600,color:C.ink,fontSize:15,cursor:"pointer"}}>{cl?.name}</div>
        <div style={{fontSize:12.5,color:C.muted,marginTop:2}}>{cl?.nif}</div></div><Badge map={INVOICE_STATUS} value={inv.status}/></div>
      <div style={{fontSize:12.5,color:C.muted,marginTop:14}}>Fecha: <b style={{color:C.ink}}>{inv.date}</b>{inv.fromQuote&&<span> · desde presup.</span>}</div>
    </div>
    <Section title="Partidas"/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"4px 14px"}}>
      {t.detail.map((d,i)=><div key={d.itemId} style={{padding:"11px 0",borderBottom:i===t.detail.length-1?"none":`1px solid ${C.line}`,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:13.5,color:C.ink,fontWeight:500}}>{d.item?.name}{d.item?.hasQuality&&d.quality?<span style={{color:C.sage}}> · {qLabel(d.quality)}</span>:null}</div><div style={{fontSize:12,color:C.muted}}>{d.qty} {d.item?.unit} × {eur(d.unit)}</div></div>
        <div style={{fontWeight:600,color:C.ink,fontSize:13.5}}>{eur(d.lineBase)}</div></div>)}</div>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:"6px 14px",marginTop:12}}>
      <Tline k="Base imponible" v={eur(t.baseAfter)}/><Tline k="IVA (21%)" v={eur(t.ivaTotal)}/>
      <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0 8px",borderTop:`1px solid ${C.line}`,marginTop:4}}>
        <span style={{fontWeight:700,color:C.ink}}>Total</span><span style={{fontWeight:700,color:C.clay,fontSize:20,fontFamily:"Fraunces,serif"}}>{eur(t.total)}</span></div></div>
    <Section title="Estado de cobro"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{Object.keys(INVOICE_STATUS).map(s=><Chip key={s} active={inv.status===s} onClick={()=>setStatus(s)}>{INVOICE_STATUS[s].label}</Chip>)}</div>
    <div style={{display:"flex",gap:10,marginTop:16}}>
      <button disabled={busy} onClick={()=>makePDF("save")} style={{...big,background:C.ink,color:C.paper,opacity:busy?.6:1}}><I.pdf size={16} color={C.paper}/> {busy?"…":"Descargar PDF"}</button>
      <button disabled={busy} onClick={()=>makePDF("share")} style={{...big,background:C.sage,color:"#fff",opacity:busy?.6:1}}><I.chat size={16} color="#fff"/> Enviar</button>
    </div>
    <div style={{fontSize:11,color:C.muted,marginTop:14,textAlign:"center"}}>Documento de factura. Para validez fiscal completa (VERI*FACTU) consulta con tu asesoría.</div>
  </div>;
}

function EditDocScreen({data,id,go,update}){
  const qt=data.quotes.find(x=>x.id===id);
  const pr=data.projects.find(p=>p.id===qt?.projectId);
  const [projDesc,setProjDesc]=useState(qt?.projDesc ?? (pr?.desc||""));
  const [conditions,setConditions]=useState(qt?.conditions ?? ("mediante transferencia bancaria "+(data.company.iban||"")));
  const [observations,setObservations]=useState(qt?.observations ?? "");
  if(!qt) return null;
  const save=()=>{ update(d=>({...d,quotes:d.quotes.map(x=>x.id===id?{...x,projDesc,conditions,observations}:x)})); go("quote",id); };
  const ta={...inp,resize:"vertical",lineHeight:1.5,minHeight:80};
  return <div>
    <Header title="Editar documento" onBack={()=>go("quote",id)}/>
    <div style={{display:"flex",gap:8,padding:12,background:C.steel+"10",borderRadius:12,marginTop:6}}>
      <I.file size={20} color={C.steel}/><div style={{fontSize:12,color:C.steel,lineHeight:1.4}}>Edita los textos libres del presupuesto. Aparecerán tal cual en el PDF. Las partidas y precios se editan en el propio presupuesto.</div></div>
    <Section title="Descripción del trabajo"/>
    <textarea value={projDesc} onChange={e=>setProjDesc(e.target.value)} rows={4} style={ta} placeholder="Detalle del trabajo a realizar, materiales, acabados…"/>
    <Section title="Condiciones de pago"/>
    <textarea value={conditions} onChange={e=>setConditions(e.target.value)} rows={2} style={ta}/>
    <Section title="Observaciones"/>
    <textarea value={observations} onChange={e=>setObservations(e.target.value)} rows={3} style={ta} placeholder="Plazos, validez, notas comerciales, disclaimer IA…"/>

}

function AIScreen({data}){
  const styles=["Moderno","Minimalista","Rústico","Industrial","Nórdico","Mediterráneo"];
  const [type,setType]=useState("Baño"); const [style,setStyle]=useState("Moderno");
  const [desc,setDesc]=useState("azulejo blanco mate, plato de ducha negro, mampara transparente, mueble suspendido de madera");
  const [photo,setPhoto]=useState(null);
  const [result,setResult]=useState(null); const [loading,setLoading]=useState(false); const [err,setErr]=useState("");
  const onFile=(e)=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f);}};
  const generate=async()=>{
    setErr(""); setResult(null);
    if(!data.settings.apiKey){ setErr("Falta la clave API. Ve a Ajustes y añádela."); return; }
    setLoading(true);
    const prompt=`Fotografía realista de un/a ${type.toLowerCase()} reformado, estilo ${style.toLowerCase()}. ${desc}. Render fotorrealista de interiorismo, iluminación natural, alta calidad, sin texto ni personas.`;
    try{ const img=await generateAIImage(data.settings.apiKey,prompt,data.settings.aiQuality||"high"); setResult(img); }
    catch(e){ setErr(e.message); }
    setLoading(false);
  };
  return <div>
    <Header title="Simulación IA"/>
    <div style={{background:`linear-gradient(135deg,${C.amber},${C.clay})`,color:"#fff",borderRadius:18,padding:18,display:"flex",gap:12,alignItems:"center"}}>
      <I.spark size={26} color="#fff"/><div style={{fontSize:13,lineHeight:1.4}}>Genera una visualización realista de cómo quedaría la reforma terminada.</div></div>
    {!data.settings.apiKey&&<div style={{display:"flex",gap:8,marginTop:12,padding:12,background:C.amber+"18",borderRadius:12,border:`1px solid ${C.amber}44`}}>
      <I.key size={20} color={C.amber}/><div style={{fontSize:12,color:C.ink}}>Necesitas configurar tu clave API de OpenAI en <b>Ajustes</b> para generar imágenes.</div></div>}
    <Section title="1 · Foto del espacio (referencia)"/>
    <label style={{display:"block"}}><input type="file" accept="image/*" capture="environment" onChange={onFile} style={{display:"none"}}/>
      <div style={{aspectRatio:"16/9",borderRadius:16,background:photo?"#000":C.line,display:"grid",placeItems:"center",color:C.muted,border:`1px dashed ${C.muted}66`,cursor:"pointer",overflow:"hidden"}}>
        {photo?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{textAlign:"center"}}><I.cam size={30}/><div style={{fontSize:12.5,marginTop:8}}>Tomar foto o subir imagen</div></div>}</div></label>
    <Section title="2 · Tipo de reforma"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{["Baño","Cocina","Salón","Fachada","Local","Terraza"].map(t=><Chip key={t} active={type===t} onClick={()=>setType(t)}>{t}</Chip>)}</div>
    <Section title="3 · Estilo"/>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{styles.map(s=><Chip key={s} active={style===s} onClick={()=>setStyle(s)}>{s}</Chip>)}</div>
    <Section title="4 · Descripción"/>
    <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={3} style={{...inp,resize:"none",lineHeight:1.5}}/>
    <button onClick={generate} disabled={loading} style={{...big,background:C.ink,color:C.paper,width:"100%",marginTop:16,opacity:loading?.6:1}}>
      <I.spark size={16} color={C.paper}/> {loading?"Generando… (10-30 s)":"Generar simulación"}</button>
    {err&&<div style={{display:"flex",gap:8,marginTop:12,padding:12,background:C.clay+"14",borderRadius:12,border:`1px solid ${C.clay}33`}}>
      <I.warn size={20} color={C.clay}/><div style={{fontSize:12.5,color:C.clayDk}}>{err}</div></div>}
    {result&&<>
      <Section title="Resultado · antes / después"/>
      <div style={{display:"flex",gap:10}}>
        <div style={{flex:1}}><div style={{aspectRatio:"1",borderRadius:12,background:photo?"#000":C.line,display:"grid",placeItems:"center",color:C.muted,overflow:"hidden"}}>{photo?<img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<I.cam size={22}/>}</div>
          <div style={{textAlign:"center",fontSize:11.5,color:C.muted,marginTop:6}}>Antes</div></div>
        <div style={{flex:1}}><div style={{aspectRatio:"1",borderRadius:12,overflow:"hidden",border:`1px solid ${C.clay}33`}}><img src={result} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
          <div style={{textAlign:"center",fontSize:11.5,color:C.clay,marginTop:6,fontWeight:600}}>Generada IA</div></div></div>
      <div style={{display:"flex",gap:8,marginTop:12,padding:12,background:C.amber+"14",borderRadius:12,border:`1px solid ${C.amber}33`}}>
        <I.warn size={26} color={C.amber}/><div style={{fontSize:11.5,color:C.ink,lineHeight:1.4}}>Imagen generada por IA con carácter orientativo. No sustituye plano técnico, medición ni memoria de calidades.</div></div>
      <a href={result} download="simulacion_ia.png" style={{...big,background:C.sage,color:"#fff",textDecoration:"none",marginTop:12}}><I.img size={16} color="#fff"/> Descargar imagen</a>
    </>}
  </div>;
}

function SettingsScreen({data,update}){
  const [c,setC]=useState(data.company);
  const [key,setKey]=useState(data.settings.apiKey);
  const [pin,setPin]=useState(data.settings.pin);
  const [pinOn,setPinOn]=useState(data.settings.pinEnabled);
  const [quality,setQuality]=useState(data.settings.aiQuality||"high");
  const [showKey,setShowKey]=useState(false);
  const setF=(k)=>(e)=>setC({...c,[k]:e.target.value});
  const save=()=>{ update(d=>({...d,company:c,settings:{...d.settings,apiKey:key,aiQuality:quality,pin:pin.slice(0,6),pinEnabled:pinOn&&pin.length>=4}})); alert("Ajustes guardados."); };
  return <div>
    <Header title="Ajustes"/>
    <Section title="Datos de empresa (PDF)"/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16}}>
      <Field label="Nombre / razón social" value={c.name} onChange={setF("name")}/>
      <Field label="NIF / CIF" value={c.nif} onChange={setF("nif")}/>
      <Field label="Dirección fiscal" value={c.address} onChange={setF("address")}/>
      <Field label="Teléfono" value={c.phone} onChange={setF("phone")}/>
      <Field label="Email" value={c.email} onChange={setF("email")}/>
      <Field label="IBAN (cuenta de cobro)" value={c.iban} onChange={setF("iban")}/>
      <Field label="Próximo nº de presupuesto" type="number" value={c.nextNumber} onChange={e=>setC({...c,nextNumber:+e.target.value||c.nextNumber})}/>
    </div>
    <Section title="Inteligencia artificial"/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16}}>
      <label style={{display:"block"}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Clave API de OpenAI</div>
        <div style={{display:"flex",gap:8}}>
          <input type={showKey?"text":"password"} value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-..." style={{...inp,flex:1}}/>
          <button onClick={()=>setShowKey(!showKey)} style={{...inp,width:54,cursor:"pointer",fontSize:12}}>{showKey?"Ocultar":"Ver"}</button>
        </div></label>
      <div style={{fontSize:11,color:C.muted,marginTop:8,lineHeight:1.5}}>Modelo <b>gpt-image-2</b> (ChatGPT Images 2.0). Se guarda solo en este móvil. La app llama a OpenAI directamente con tu clave. Configura un límite de gasto en tu panel de OpenAI.</div>
      <label style={{display:"block",marginTop:12}}><div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>Calidad de imagen</div>
        <div style={{display:"flex",gap:8}}>
          {[["low","Rápida"],["medium","Media"],["high","Alta (pro)"]].map(([v,l])=><Chip key={v} active={quality===v} onClick={()=>setQuality(v)}>{l}</Chip>)}
        </div></label>
      <div style={{fontSize:11,color:C.muted,marginTop:6}}>Mayor calidad = mejor resultado pero más coste y algo más lenta.</div>
    </div>
    <Section title="Seguridad"/>
    <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:16}}>
      <label style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <span style={{fontSize:14,color:C.ink}}>Bloqueo con PIN</span>
        <input type="checkbox" checked={pinOn} onChange={e=>setPinOn(e.target.checked)} style={{width:20,height:20}}/></label>
      {pinOn&&<Field label="PIN (4-6 dígitos)" type="number" value={pin} onChange={e=>setPin(e.target.value.slice(0,6))} inputMode="numeric"/>}
    </div>
    <button onClick={save} style={{...big,background:C.clay,color:"#fff",width:"100%",marginTop:16}}>Guardar ajustes</button>
    <div style={{marginTop:14,padding:14,background:C.steel+"10",borderRadius:12,fontSize:11.5,color:C.steel,lineHeight:1.5}}>
      Versión MVP · PWA. Los datos se guardan en este dispositivo. La facturación con validez fiscal (VERI*FACTU) y la sincronización multi-dispositivo requieren backend (fase 2).</div>
    <button onClick={()=>{if(confirm("¿Restablecer TODO a datos de ejemplo? Se perderá lo creado.")){localStorage.removeItem(STORE_KEY);location.reload();}}}
      style={{...big,background:C.card,color:C.clayDk,border:`1px solid ${C.line}`,width:"100%",marginTop:12}}><I.trash size={16} color={C.clayDk}/> Restablecer datos</button>
  </div>;
}

/* ---------- Navegación ---------- */
const TABS=[
  {key:"home",label:"Inicio",icon:I.home},
  {key:"clients",label:"Clientes",icon:I.users},
  {key:"quotes",label:"Presup.",icon:I.file},
  {key:"invoices",label:"Facturas",icon:I.receipt},
  {key:"settings",label:"Ajustes",icon:I.cog},
];

function App(){
  const [data,setData]=useState(loadData);
  const [screen,setScreen]=useState("home");
  const [param,setParam]=useState(null);
  const [unlocked,setUnlocked]=useState(false);

  useEffect(()=>{ saveData(data); },[data]);

  const locked = data.settings.pinEnabled && data.settings.pin && !unlocked;

  const go=(s,p=null)=>{setScreen(s);setParam(p);const el=document.getElementById("scroll");if(el)el.scrollTop=0;window.scrollTo(0,0);};
  const update=(fn)=>setData(d=>fn(d));
  const addClient=(c)=>setData(d=>({...d,clients:[c,...d.clients]}));
  const addProject=(p)=>setData(d=>({...d,projects:[p,...d.projects]}));
  const addQuote=(q)=>setData(d=>({...d,quotes:[q,...d.quotes],company:{...d.company,nextNumber:(+d.company.nextNumber||204)+1}}));

  if(locked) return <PinGate pin={data.settings.pin} onOk={()=>setUnlocked(true)}/>;

  const activeTab=({client:"clients",newClient:"clients",project:"projects",newProject:"projects",quote:"quotes",newQuote:"quotes",editDoc:"quotes",catalog:"quotes",invoice:"invoices"})[screen]||screen;
  const render=()=>{
    switch(screen){
      case "home": return <HomeScreen data={data} go={go}/>;
      case "clients": return <ClientsScreen data={data} go={go}/>;
      case "newClient": return <NewClientScreen go={go} addClient={addClient}/>;
      case "client": return <ClientScreen data={data} id={param} go={go} update={update}/>;
      case "projects": return <ProjectsScreen data={data} go={go}/>;
      case "newProject": return <NewProjectScreen data={data} go={go} addProject={addProject} preClient={param}/>;
      case "project": return <ProjectScreen data={data} id={param} go={go}/>;
      case "quotes": return <QuotesScreen data={data} go={go}/>;
      case "newQuote": return <NewQuoteScreen data={data} go={go} addQuote={addQuote} pre={param}/>;
      case "quote": return <QuoteScreen data={data} id={param} go={go} update={update}/>;
      case "editDoc": return <EditDocScreen data={data} id={param} go={go} update={update}/>;
      case "catalog": return <CatalogScreen data={data} go={go} update={update}/>;
      case "invoices": return <InvoicesScreen data={data} go={go}/>;
      case "invoice": return <InvoiceScreen data={data} id={param} go={go} update={update}/>;
      case "ai": return <AIScreen data={data}/>;
      case "settings": return <SettingsScreen data={data} update={update}/>;
      default: return <HomeScreen data={data} go={go}/>;
    }
  };
  return <div style={{minHeight:"100vh",background:C.paper,display:"flex",flexDirection:"column",fontFamily:"'Public Sans',-apple-system,sans-serif",maxWidth:480,margin:"0 auto"}}>
    <div id="scroll" style={{flex:1,overflowY:"auto",padding:"0 18px calc(18px + env(safe-area-inset-bottom))"}}>{render()}</div>
    <div style={{display:"flex",background:C.card,borderTop:`1px solid ${C.line}`,padding:"8px 4px calc(10px + env(safe-area-inset-bottom))",flexShrink:0}}>
      {TABS.map(t=>{const on=activeTab===t.key;return <button key={t.key} onClick={()=>go(t.key)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:on?C.clay:C.muted,padding:"4px 0"}}>
        <t.icon size={20} sw={on?2.4:2} color={on?C.clay:C.muted}/><span style={{fontSize:9.5,fontWeight:on?700:500}}>{t.label}</span></button>;})}</div>
  </div>;
}

const lnk={background:"none",border:"none",color:C.clay,fontSize:13,fontWeight:600,cursor:"pointer"};
const addBtn={background:C.clay,border:"none",borderRadius:12,width:38,height:38,display:"grid",placeItems:"center",cursor:"pointer"};
const inp={width:"100%",boxSizing:"border-box",padding:"12px 14px",borderRadius:12,border:`1px solid ${C.line}`,background:C.card,fontSize:15,color:C.ink,outline:"none"};
const infoCard={background:C.card,border:`1px solid ${C.line}`,borderRadius:16,padding:"4px 16px",marginTop:14};
const big={flex:1,border:"none",borderRadius:13,padding:"14px 10px",cursor:"pointer",fontSize:14,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:7};
const iconBox=(c)=>({width:42,height:42,borderRadius:12,background:c+"14",display:"grid",placeItems:"center",flexShrink:0});
const empty={textAlign:"center",color:C.muted,fontSize:13,padding:"30px 0"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

if ('serviceWorker' in navigator) {

    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
